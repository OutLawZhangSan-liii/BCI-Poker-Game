[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "brain-game-device-gateway"
version = "0.1.0"
description = "Replaceable device communication layer for the Brain Game desktop app"
requires-python = ">=3.9"

[tool.pytest.ini_options]
testpaths = ["device_gateway/tests"]
pythonpath = ["."]

